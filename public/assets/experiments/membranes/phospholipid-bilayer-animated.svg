<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 360" role="img" aria-label="Animated phospholipid bilayer">
  <style>
    .lipid-row {
      transform-box: fill-box;
      transform-origin: center;
      animation: lipid-drift 3s ease-in-out infinite;
    }

    @keyframes lipid-drift {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-1.5px); }
    }

    @media (prefers-reduced-motion: reduce) {
      .lipid-row { animation: none; }
    }
  </style>

  <rect width="96" height="360" fill="#2b103d"/>

  <g stroke="#93b469" stroke-width="3" stroke-linecap="round" fill="none">
    <path id="lt" d="M18 9 Q28 4 36 9 T45 9"/>
    <path id="lb" d="M18 17 Q28 22 36 17 T45 17"/>
    <path id="rt" d="M78 9 Q68 4 60 9 T51 9"/>
    <path id="rb" d="M78 17 Q68 22 60 17 T51 17"/>
  </g>

  <g id="lipid-pair" stroke="#333" stroke-width="1.2" fill="#f5cb5c">
    <use href="#lt" stroke="#93b469"/>
    <use href="#lb" stroke="#93b469"/>
    <circle cx="12" cy="13" r="7"/>
    <circle cx="14" cy="11" r="1.6" fill="#fffae0" stroke="none"/>
    <use href="#rt" stroke="#93b469"/>
    <use href="#rb" stroke="#93b469"/>
    <circle cx="84" cy="13" r="7"/>
    <circle cx="82" cy="11" r="1.6" fill="#fffae0" stroke="none"/>
  </g>

  <g transform="translate(0 0)"><g class="lipid-row" style="animation-delay: 0s"><use href="#lipid-pair"/></g></g>
  <g transform="translate(0 30)"><g class="lipid-row" style="animation-delay: -0.3s"><use href="#lipid-pair"/></g></g>
  <g transform="translate(0 60)"><g class="lipid-row" style="animation-delay: -0.7s"><use href="#lipid-pair"/></g></g>
  <g transform="translate(0 90)"><g class="lipid-row" style="animation-delay: -0.2s"><use href="#lipid-pair"/></g></g>
  <g transform="translate(0 120)"><g class="lipid-row" style="animation-delay: -0.9s"><use href="#lipid-pair"/></g></g>
  <g transform="translate(0 150)"><g class="lipid-row" style="animation-delay: -0.5s"><use href="#lipid-pair"/></g></g>
  <g transform="translate(0 180)"><g class="lipid-row" style="animation-delay: -0.1s"><use href="#lipid-pair"/></g></g>
  <g transform="translate(0 210)"><g class="lipid-row" style="animation-delay: -0.8s"><use href="#lipid-pair"/></g></g>
  <g transform="translate(0 240)"><g class="lipid-row" style="animation-delay: -0.4s"><use href="#lipid-pair"/></g></g>
  <g transform="translate(0 270)"><g class="lipid-row" style="animation-delay: -0.6s"><use href="#lipid-pair"/></g></g>
  <g transform="translate(0 300)"><g class="lipid-row" style="animation-delay: -1s"><use href="#lipid-pair"/></g></g>
  <g transform="translate(0 330)"><g class="lipid-row" style="animation-delay: -0.25s"><use href="#lipid-pair"/></g></g>
</svg>
