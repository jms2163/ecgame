<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>ECGame</title>

    <!-- Temporary Pond UI Styles -->
    <style>
        .hidden {
            display: none;
        }

        #pond-zoom-navigation {
            display: flex;
            gap: 8px;
            margin-bottom: 20px;
        }

        .zoom-tab {
            padding: 8px 14px;
            cursor: pointer;
        }

        .zoom-tab:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
    </style>
</head>

<body>

    <div id="app">

        <main id="pond-zone">

            <nav id="pond-zoom-navigation">

                <button
                    id="btn-pond-grid"
                    class="zoom-tab active"
                    data-level="0">
                    🌐 Microbiome
                </button>

                <button
                    id="btn-cell"
                    class="zoom-tab"
                    data-level="1">
                    🦠 Cell View
                </button>

                <button
                    id="btn-organelle"
                    class="zoom-tab"
                    data-level="2">
                    🔬 Organelle Lab
                </button>

            </nav>

            <section
                id="pond-grid-view"
                class="zoom-layer">

                <h1>Microbiome View</h1>

                <div id="pond-workspace">

                    <div id="pond-viewport-container">
                        <p>PondGrid will render here.</p>
                    </div>

                </div>

            </section>

            <section
                id="cell-view"
                class="zoom-layer hidden">

                <h1>Cell View</h1>

                <p>
                    Cell organelles will appear here.
                </p>

            </section>

            <section
                id="organelle-view"
                class="zoom-layer hidden">

                <h1>Organelle Lab</h1>

                <p>
                    Organelle studies and experiments will appear here.
                </p>

            </section>

        </main>

        <section
            id="test-zone"
            class="hidden">

            <h1>Test Zone</h1>

            <p>
                Temporary zone used to verify
                ZoneManager transitions.
            </p>

        </section>

    </div>

    <script
        type="module"
        src="./src/app/main.js">
    </script>

</body>

</html>
